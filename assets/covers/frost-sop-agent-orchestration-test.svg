<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FROST-SOP orchestration test</title>
  <desc id="desc">Event orchestration with retry, audit trail and controlled failure recovery.</desc>
  <rect width="1280" height="720" fill="#f3f1eb"/>
  <path d="M64 82H1216M64 638H1216" stroke="#17222d" stroke-width="2"/>
  <text x="64" y="54" fill="#d9572b" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" letter-spacing="3">AGENT LAB / PRACTICE</text>
  <text x="1216" y="54" text-anchor="end" fill="#6c7478" font-family="DejaVu Sans Mono, monospace" font-size="17">FIELD NOTE · 2026</text>
  <g font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="24" fill="#17222d">
    <rect x="90" y="205" width="220" height="150" fill="#dbe7e5"/><text x="132" y="270">START</text><text x="132" y="314" font-size="17" font-weight="400">event emitted</text>
    <rect x="390" y="205" width="220" height="150" fill="#17222d"/><text x="432" y="270" fill="#f3f1eb">RUN</text><text x="432" y="314" fill="#dbe7e5" font-size="17" font-weight="400">worker fails</text>
    <rect x="690" y="205" width="220" height="150" fill="#dbe7e5"/><text x="732" y="270">RETRY</text><text x="732" y="314" font-size="17" font-weight="400">idempotent delivery</text>
    <rect x="990" y="205" width="220" height="150" fill="#277187"/><text x="1032" y="270" fill="#f3f1eb">AUDIT</text><text x="1032" y="314" fill="#f3f1eb" font-size="17" font-weight="400">trace is complete</text>
  </g>
  <g stroke="#17222d" stroke-width="4" fill="none"><path d="M310 280H390"/><path d="M610 280H690"/><path d="M910 280H990"/><path d="m375 268 20 12-20 12M675 268l20 12-20 12M975 268l20 12-20 12"/></g>
  <path d="M500 390C500 510 780 510 780 390" stroke="#d9572b" stroke-width="7" fill="none" stroke-dasharray="14 12"/>
  <text x="64" y="686" fill="#17222d" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">FROST-SOP: retries, failure recovery and audit trail</text>
</svg>
