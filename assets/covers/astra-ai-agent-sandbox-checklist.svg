  <rect width="1280" height="720" fill="#07111f"/>
  <circle cx="1080" cy="110" r="230" fill="#163254" opacity=".55"/>
  <circle cx="170" cy="650" r="250" fill="#173f3b" opacity=".42"/>
  <text x="80" y="105" fill="#8ee8d1" font-family="Arial,sans-serif" font-size="26" font-weight="700">AGENT LAB · ПРАКТИКУМ</text>
  <text x="80" y="175" fill="#ffffff" font-family="Arial,sans-serif" font-size="50" font-weight="700">AI-агент в песочнице</text>
  <text x="80" y="225" fill="#b8c7da" font-family="Arial,sans-serif" font-size="25">30 минут на проверку защитного контура</text>
  <rect x="390" y="292" width="500" height="220" rx="34" fill="#10243a" stroke="#64dfc0" stroke-width="4"/>
  <rect x="530" y="350" width="220" height="105" rx="20" fill="#1a3852" stroke="#ffffff" stroke-width="2"/>
  <text x="640" y="392" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="25" font-weight="700">AI-АГЕНТ</text>
  <text x="640" y="428" text-anchor="middle" fill="#8ee8d1" font-family="Arial,sans-serif" font-size="18">READ-ONLY</text>
  <g fill="#0e1d2e" stroke="#5aa7ff" stroke-width="2">
    <rect x="80" y="310" width="230" height="72" rx="18"/><rect x="80" y="420" width="230" height="72" rx="18"/>
    <rect x="970" y="310" width="230" height="72" rx="18"/><rect x="970" y="420" width="230" height="72" rx="18"/>
  </g>
  <g fill="#dceaff" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <text x="195" y="354">МИНИМУМ ПРАВ</text><text x="195" y="464">EGRESS ALLOWLIST</text>
    <text x="1085" y="354">ПОДТВЕРЖДЕНИЕ</text><text x="1085" y="464">ЖУРНАЛ + STOP</text>
  </g>
  <g stroke="#64dfc0" stroke-width="3" fill="none"><path d="M310 346H390"/><path d="M310 456H390"/><path d="M890 346H970"/><path d="M890 456H970"/></g>
  <text x="80" y="650" fill="#ffffff" font-family="Arial,sans-serif" font-size="27">Новость → вывод → безопасный canary-тест</text>
